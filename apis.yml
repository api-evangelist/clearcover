aid: clearcover
name: Clearcover
description: >-
  Clearcover is a digital-first auto insurance company that offers customizable, affordable
  car insurance backed by AI-assisted claims that can resolve eligible claims in minutes rather
  than days. Customers buy and manage policies through a mobile app, file claims by photographing
  damage, and track claim status in real time, with coverage spanning liability, comprehensive
  and collision, medical payments, uninsured/underinsured motorist protection, roadside assistance,
  and alternate transportation. Clearcover operates across multiple US states through several
  underwriting entities, distributes through both direct and independent-agent channels, and runs
  a developer portal for partner and embedded insurance integrations. It was surfaced in the API
  Evangelist network as a portfolio company of 500 Global and enriched from its public web surface.
